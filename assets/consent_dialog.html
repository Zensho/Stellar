<!DOCTYPE html>
<html lang="en">
    <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0 user-scalable=no">
    <title>Consent Dialog</title>
    <style>
    body {
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .dialog-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .content {
      flex: 1;
      padding: 5px;
      overflow-y: auto;  /*添加這一行以使內容超出時出現垂直滾動條 */
    }
    /*dialog{ global dialog setting */
    /*#dialog id setting */
    #dialog {
        position: relative;
        width: 600px;
        height: 360px;
        /*width: 80vw;
        height: 60vh;*/
        /*max-width: 600px;
        max-height: 600px;
        min-width: 350px;
        min-height: 200px;*/
        z-index: 100;
        /* Set frame lines */
        border: 1px solid #ccc;
        box-shadow: 0 2px 6px #ccc;
        border-radius: 10px;
        /* Set inner content margin */
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-size: 15px;
        /* Set white background */
        background-color: #fff;
    }
    #dialog p {
      margin: 0 0 1em;
    }
    #dialogTitle {
      font-size: 20px; /* 設定字體大小為20像素 */
      padding-right: 120px;
      margin: 0 0 1em;
    }
    #languageSelect {
        position: absolute;
        right: 10px;
        top: 10px;
        margin: 2px;
        /*width: 100px;
        height: 30px;*/
        padding: .3em .5em;
        font-size: 15px;
        border-radius: 0.375em;
        border: 1px solid #ccc;
        color: #333;
    }
    #checkButton,
    #acceptButton {
        /* width: 180px; */
        /* height: 60px; */
        font-size: 15px;
        white-space: nowrap; /* 防止文字換行 */
        /* overflow: scroll; */
        text-align: center; /* 將文字置中 */
        margin-top: 10px;
    }
    #acceptButton{
        /* background-color: lightblue;
        border-radius: 50px; */
    }
    button {
      padding: 0.75em 1.5em;
      display: inline-block;
      margin: 0.25em 0.125em;
      border: none;
      border-radius: 0.375em;
      background: none;
      background-color: #109fd9;
      color: #fff;
      overflow: hidden;
    }
    @media (hover: hover) {
      button:hover {
        filter: brightness(1.15);
        cursor: pointer;
      }
    }
    .tac {
      text-align: center;
    }
    .cookie_switch input {
      font-size: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .cookie_switch {
      display: flex;
      margin: 0 0 1em;
    }
    .cookie_switch label {
      flex: 1 1 auto;
      padding-right: .5em;
      color: #666;
    }
    .cookie_switch_toggle {
      background-color: #ddd;
      flex: 0 0 53px;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .cookie_switch_toggle::before,
    .cookie_switch_toggle::after {
      position: absolute;
      font-size: 11px;
      top: 50%;
    }
    .cookie_switch_toggle::before {
      content: "ON";
      left: 0.6em;
      transform: translate(0, -50%);
      color: #fff;
      opacity: 0;
    }
    .cookie_switch_toggle::after {
      content: "OFF";
      right: 0.6em;
      transform: translate(0, -50%);
      color: rgba(#000, 0.4);
    }
    .cookie_switch_toggle span {
      position: absolute;
      top: 50%;
      left: 4px;
      transform: translate(0, -50%);
      width: 18px;
      height: 18px;
      background-color: #fff;
      border-radius: 50%;
    }
    .off .cookie_switch_toggle::before {
      opacity: 0;
    }
    .off .cookie_switch_toggle::after {
      opacity: 1;
    }
    .off .cookie_switch_toggle span {
      left: 4px;
      right: auto;
    }
    .on .cookie_switch_toggle {
      background-color: #64e1d7;
    }
    .on .cookie_switch_toggle::before {
      opacity: 1;
    }
    .on .cookie_switch_toggle::after {
      opacity: 0;
    }
    .on .cookie_switch_toggle span {
      right: 4px;
      left: auto;
    }/*
    @media only screen and (max-width: 960px) {
      @media screen and (orientation: landscape) {
        #dialog {
          height: auto;
          margin-top: 1em;
          margin-bottom: 1em;
        }

      @media screen and (orientation: portrait) {

            height: 340px;
        }
      }
      #dialog,#languageSelect,#checkButton,#acceptButton  {
        font-size: 13px;
      }
      #dialogTitle {
        font-size: 18px;        
      }
    }
	</style>

            function debug(log){
                if(isIOS()) {
                    window.webkit.messageHandlers.consolelog.postMessage(log);
                }else{
                    console.log(log);
                }
                //var debug = document.getElementById("debug");
                //debug.innerText = log;

            function centerDialog() {
                //debug('centerDialog');
                const dialog = document.getElementById("dialog");
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const dialogWidth = dialog.offsetWidth;
                const dialogHeight = dialog.offsetHeight;

                const top = (windowHeight - dialogHeight) / 2;
                const left = (windowWidth - dialogWidth) / 2;

                dialog.style.top = `${top}px`;
                dialog.style.left = `${left}px`;
            }
            window.onload = function() {
                var lang = (window.navigator.language || window.navigator.userLanguage).toLowerCase();
                debug('window.onload：' + lang);
                //window.addEventListener('resize', centerDialog);
                //centerDialog();
                var countrycode = lang.substring(0, 2);
                setLanguageSelect(countrycode);
                updateDialogContent(countrycode);
                loadJavascript();
                
                //window.addEventListener("load", centerDialog);
                //window.addEventListener("resize", centerDialog);
                document.getElementById("dialog").showModal();
            }
            function handleCheckboxClick(checkboxId) {
                var checkbox = document.getElementById(checkboxId);
                debug(checkboxId + ' 選中狀態：' + checkbox.checked);
                document.querySelectorAll('.cookie_switch').forEach((cookieSwitch, index) => {
                    const checkbox = cookieSwitch.querySelector('input[type="checkbox"]');
                    const checkswitch = cookieSwitch.querySelector('.cookie_switch_toggle');
                    if (checkbox.checked) {
                      cookieSwitch.classList.remove('off');
                      cookieSwitch.classList.add('on');
                    } else {
                      cookieSwitch.classList.remove('on');
                      cookieSwitch.classList.add('off');
                    }
                });
            }
            function handlesSwitchToggle(checkboxId) {
                var checkbox = document.getElementById(checkboxId);
                checkbox.checked = !checkbox.checked;
                debug('Switch: ' + checkboxId + ' 選中狀態：' + checkbox.checked);
                document.querySelectorAll('.cookie_switch').forEach((cookieSwitch, index) => {
                    const checkbox = cookieSwitch.querySelector('input[type="checkbox"]');
                    const checkswitch = cookieSwitch.querySelector('.cookie_switch_toggle');
                    if (checkbox.checked) {
                      cookieSwitch.classList.remove('off');
                      cookieSwitch.classList.add('on');
                    } else {
                      cookieSwitch.classList.remove('on');
                      cookieSwitch.classList.add('off');
                    }
                });
            }
            function setLanguageSelect(lang) {
                debug('setLanguageSelect：' + lang);
                var languageSelect = document.getElementById("languageSelect");
				if (translations.hasOwnProperty(lang)) {
					languageSelect.value = lang;
				}else{
					languageSelect.value = 'en'
				}
            }
            function changeLanguage() {
                var selectedLanguage = document.getElementById("languageSelect").value;
                debug('changeLanguage：' + selectedLanguage);
                updateDialogContent(selectedLanguage);
            }
            function updateDialogContent(lang) {
                debug('updateDialogContent：' + lang);
                var titleElement = document.getElementById("dialogTitle");
                var contentElement = document.getElementById("dialogContent");
                var checkboxLabels = [
                    document.getElementById("checkboxLabel1"),
                    document.getElementById("checkboxLabel2"),
                    document.getElementById("checkboxLabel3"),
                    document.getElementById("checkboxLabel4")
                ];
                var acceptButton = document.getElementById("acceptButton");
                var checkButton = document.getElementById("checkButton");
                
                // 根据用戶的地理位置確定當前國家代碼
                const userCountryCode = lang
                if (translations.hasOwnProperty(userCountryCode)) {
                  const currentTranslation = translations[userCountryCode];
                  titleElement.innerText = currentTranslation.title;
                  contentElement.innerText = currentTranslation.content;
                  checkboxLabels[0].innerText = currentTranslation.checkboxes[0];
                  checkboxLabels[1].innerText = currentTranslation.checkboxes[1];
                  checkboxLabels[2].innerText = currentTranslation.checkboxes[2];
                  checkboxLabels[3].innerText = currentTranslation.checkboxes[3];
                  acceptButton.innerText = currentTranslation.acceptAll;
                  checkButton.innerText = currentTranslation.acceptChecked;
                }else{
                  titleElement.innerText = "European Personal Data Protection Policy";
                  contentElement.innerText = "The policy requires applications to obtain user consent before collecting identifiers, sharing personal information, and engaging in personalized advertising. Do you agree to the following:";

                  checkboxLabels[2].innerText = "Set consent statement to transmit user data to Google for online advertising.";
                  checkboxLabels[3].innerText = "Set consent statement for personalized advertising.";
                  acceptButton.innerText = "Accept All";
                  checkButton.innerText = "Accept Checked";
                    /*if (userCountryCode.startsWith('zh')) {
                        titleElement.innerText = "歐洲個人隱私保護法政策";
                        contentElement.innerText = "政策要求應用在蒐集個人標示符，分享使用個人資訊，進行個人化廣告之前，需先徵得用戶同意，您是否同意以下幾點:";

                        checkboxLabels[2].innerText = "設定將使用者資料傳送給 Google 的同意聲明，以用於線上廣告。";
                        checkboxLabels[3].innerText = "設定個人化廣告的同意聲明。";
                        acceptButton.innerText = "全部同意";
                        checkButton.innerText = "勾選同意";

            }
            function acceptAll() {
                //alert("All accepted");
                var checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(function(checkbox) {
                    checkbox.checked = true;
                    // update all switch box status
                    document.querySelectorAll('.cookie_switch').forEach((cookieSwitch, index) => {
                        const checkbox = cookieSwitch.querySelector('input[type="checkbox"]');
                        const checkswitch = cookieSwitch.querySelector('.cookie_switch_toggle');
                        if (checkbox.checked) {
                          cookieSwitch.classList.remove('off');
                          cookieSwitch.classList.add('on');
                        } else {
                          cookieSwitch.classList.remove('on');
                          cookieSwitch.classList.add('off');
                        }
                    });
                });
                var nbConsentFlags = 15;
                debug('acceptAll 選中狀態：' + nbConsentFlags);
                callJavascript(nbConsentFlags);
            }
            function checkedAll() {
                //alert("Accept Checked");
                var checkboxes = document.querySelectorAll('input[type="checkbox"]');
                var nbConsentFlags = 0;
                if(checkboxes.item(0).checked){
                    nbConsentFlags += 1;
                }
                if(checkboxes.item(1).checked){
                    nbConsentFlags += 2;
                }
                if(checkboxes.item(2).checked){
                    nbConsentFlags += 4;
                }
                if(checkboxes.item(3).checked){
                    nbConsentFlags += 8;
                }
                debug('checked 選中狀態：' + nbConsentFlags);
                callJavascript(nbConsentFlags);
            }
            function isAndroid() {
                return /Android/i.test(navigator.userAgent);
            }
            function isIOS() {
                if(/iOS|iPhone|iPad|iPod/i.test(navigator.userAgent)){
                    return true;
                }else if(/Mac/i.test(navigator.userAgent)){
                    try{
                        document.createEvent('TouchEvent');
                        return true;
                    }catch(e){
                        // is mac pc
                        //console.log('isIOS error: ' + e);
                    }
                }
                return false;
                
                //return /iOS|iPhone|iPad|iPod|Mac/i.test(navigator.userAgent);
                //return /iOS|iPhone|iPad|iPod|Mac/i.test(navigator.platform);
            }
            function isWindows() {
                return /Windows/i.test(navigator.userAgent);
            }
            function callJavascript(_nbConsentFlags) {
                if(isAndroid()) {
                    window.xlgame.getConsentFlags(_nbConsentFlags);
                }else if(isIOS()) {
                    window.webkit.messageHandlers.getConsentFlags.postMessage(_nbConsentFlags);
                }else if(isWindows()) {
                    debug("call isWindows");
                }else{
                    debug('call other platforms, navigator.userAgent：' + navigator.userAgent);
                }
            }
            function loadJavascript() {
                debug("loadJavascript");
                if(isAndroid()) {
                    var flags = window.xlgame.loadConsentFlags();
                    initSwitchCheckbox(flags);
                }else if(isIOS()) {
                    window.webkit.messageHandlers.loadConsentFlags.postMessage('');
                }else if(isWindows()) {
                    debug("load isWindows");
                }else{
                    debug("load other platforms");
                }
            }
            function loadConsentFlags(flags) {
                debug("loadConsentFlags: " + flags);
                //bConsentFlags = flags;
                initSwitchCheckbox(flags);
            }
            function initSwitchCheckbox(_bConsentFlags) {
                debug("initSwitchCheckbox: " + _bConsentFlags);
                document.querySelectorAll('.cookie_switch').forEach((cookieSwitch, index) => {
                    const checkbox = cookieSwitch.querySelector('input[type="checkbox"]');
                    const checkswitch = cookieSwitch.querySelector('.cookie_switch_toggle');
                    
                    //revert checked consentflags
                    debug("querySelectorAll: " + _bConsentFlags + " index: " + (1 << index));
                    if (_bConsentFlags & (1 << index)) {
                        checkbox.checked = true;
                        debug("index checked: " + (1 << index));
                    } else {
                        checkbox.checked = false;
                    }
                    
                    if (checkbox.checked) {
                      cookieSwitch.classList.remove('off');
                      cookieSwitch.classList.add('on');
                    } else {
                      cookieSwitch.classList.remove('on');
                      cookieSwitch.classList.add('off');
                    }
                });
            }
